@if (open) {
  <div class="cm-overlay" (click)="closed.emit()">
    <div class="cm-card" role="alertdialog" aria-modal="true" aria-labelledby="cm-title" (click)="$event.stopPropagation()">
      <div class="cm-icon" [class.cm-icon-danger]="danger">{{ danger ? '⚠️' : '✓' }}</div>
      <h3 id="cm-title">{{ title }}</h3>
      <p>{{ message }}</p>

      <div class="cm-actions">
        <button type="button" class="cm-btn" [class.cm-solid]="danger" [class.cm-ghost]="!danger" (click)="closed.emit()">
          {{ cancelLabel }}
        </button>
        <button type="button" class="cm-btn" [class.cm-solid]="!danger" [class.cm-danger-ghost]="danger" (click)="confirmed.emit()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
