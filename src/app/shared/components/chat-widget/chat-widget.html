<button
  type="button"
  class="chat-fab"
  (click)="toggle()"
  [attr.aria-label]="open() ? 'Cerrar asistente' : 'Abrir asistente'"
>
  @if (open()) {
    <svg viewBox="0 0 24 24" width="24" height="24">
      <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" width="26" height="26">
      <path fill="currentColor" d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z" />
    </svg>
  }
</button>

@if (open()) {
  <section class="chat-panel" role="dialog" aria-label="Asistente WALON">
    <header class="chat-header">
      <div>
        <strong>Asistente WALON</strong>
        <small>Reserva tu cancha conversando</small>
      </div>
      <button type="button" class="chat-reset" (click)="reset()">Nueva</button>
    </header>

    <div class="chat-messages" #list>
      @for (m of messages(); track $index) {
        <div class="msg" [class.msg-user]="m.role === 'user'" [class.msg-bot]="m.role === 'assistant'">@for (p of parts(m.text); track $index) {<span [class.b]="p.bold">{{ p.text }}</span>}</div>
      }
      @if (sending()) {
        <div class="msg msg-bot typing"><span></span><span></span><span></span></div>
      }
    </div>

    <div class="chat-input">
      <input
        type="text"
        maxlength="500"
        placeholder="Ej: reserva mañana de 7pm a 8pm"
        [value]="input()"
        (input)="input.set($any($event.target).value)"
        (keydown.enter)="send()"
      />
      <button type="button" (click)="send()" [disabled]="sending() || !input().trim()">Enviar</button>
    </div>
  </section>
}
