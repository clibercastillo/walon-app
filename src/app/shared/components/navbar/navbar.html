<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/home" class="brand">
      <span class="brand-dot"></span>
      WALON
    </a>

    <nav class="links">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      @if (auth.isAuthenticated()) {
        @if (auth.isAdmin()) {
        <a routerLink="/stadiums" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Canchas</a>
        <a routerLink="/calendar" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Calendario</a>
        } @else {
        <a routerLink="/bookings" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Mis reservas</a>
        }
      }
    </nav>

    <div class="user">
      @if (auth.isAuthenticated()) {
        <span class="user-name">{{ auth.username() }}</span>
        <button class="btn btn-outline btn-sm" (click)="logout()">Salir</button>
      } @else {
        <a routerLink="/login" class="btn btn-primary btn-sm">Iniciar sesión</a>
      }
    </div>
  </div>
</header>

@if (auth.isAuthenticated()) {
<nav class="bottom-nav">
  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
    </svg>
    <span>Inicio</span>
  </a>
  <!-- <a routerLink="/bookings" routerLinkActive="active">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor"
        d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14z" />
    </svg>
    <span>Reservas</span>
  </a> -->
  @if (auth.isAdmin()) {
  <a routerLink="/stadiums" routerLinkActive="active">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14z" />
    </svg>
    <span>Canchas</span>
  </a>
  <a routerLink="/calendar" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Calendario</a>
  } @else {
  <a routerLink="/bookings" routerLinkActive="active">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor"
        d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14z" />
    </svg>
    <span>Reservas</span>
  </a>
  }
  <button (click)="logout()">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <path fill="currentColor"
        d="M17 7l-1.41 1.41L17.17 10H9v2h8.17l-1.58 1.59L17 15l4-4zM5 5h7V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h7v-2H5z" />
    </svg>
    <span>Salir</span>
  </button>
</nav>
}
