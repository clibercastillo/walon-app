@if (open) {
  <div class="pm-overlay" (click)="close()">
    <div class="pm-card" role="dialog" aria-modal="true" aria-labelledby="pm-title" (click)="$event.stopPropagation()">
      <div class="pm-top">
        <div>
          <span class="pm-eyebrow">Paso final</span>
          <h3 id="pm-title">Pagar y confirmar</h3>
        </div>
        <button class="pm-close" (click)="close()" [disabled]="processing()" aria-label="Cerrar">✕</button>
      </div>

      <!-- Resumen de la reserva -->
      <div class="pm-summary">
        <div class="pm-summary-info">
          <span class="pm-summary-label">Tu reserva</span>
          <strong>{{ bookingLabel }}</strong>
        </div>
        @if (amount !== null) {
          <div class="pm-amount">S/ {{ amount.toFixed(2) }}</div>
        }
      </div>

      <!-- Vista previa de la tarjeta -->
      <div class="pm-preview">
        <div class="pm-preview-top">
          <span class="pm-chip"></span>
          <span class="pm-brand">VISA</span>
        </div>
        <div class="pm-preview-number">{{ cardNumber || '•••• •••• •••• ••••' }}</div>
        <div class="pm-preview-bottom">
          <div>
            <span class="pm-preview-label">Titular</span>
            <div>{{ cardHolder || 'NOMBRE APELLIDO' }}</div>
          </div>
          <div>
            <span class="pm-preview-label">Vence</span>
            <div>{{ expiry || 'MM/AA' }}</div>
          </div>
        </div>
      </div>

      <form (ngSubmit)="submit()" class="pm-form">
        <label class="pm-field">
          <span>Nombre del titular</span>
          <input
            type="text"
            name="cardHolder"
            placeholder="Como aparece en la tarjeta"
            [(ngModel)]="cardHolder"
            [class.invalid]="errors()['cardHolder']"
            [disabled]="processing()"
            autocomplete="cc-name"
          />
          @if (errors()['cardHolder']) {
            <small class="pm-error">{{ errors()['cardHolder'] }}</small>
          }
        </label>

        <label class="pm-field">
          <span>Número de tarjeta</span>
          <input
            type="text"
            name="cardNumber"
            inputmode="numeric"
            placeholder="0000 0000 0000 0000"
            [ngModel]="cardNumber"
            (ngModelChange)="onCardNumberInput($event)"
            [class.invalid]="errors()['cardNumber']"
            [disabled]="processing()"
            autocomplete="cc-number"
            maxlength="19"
          />
          @if (errors()['cardNumber']) {
            <small class="pm-error">{{ errors()['cardNumber'] }}</small>
          }
        </label>

        <div class="pm-row">
          <label class="pm-field">
            <span>Vencimiento</span>
            <input
              type="text"
              name="expiry"
              inputmode="numeric"
              placeholder="MM/AA"
              [ngModel]="expiry"
              (ngModelChange)="onExpiryInput($event)"
              [class.invalid]="errors()['expiry']"
              [disabled]="processing()"
              autocomplete="cc-exp"
              maxlength="5"
            />
            @if (errors()['expiry']) {
              <small class="pm-error">{{ errors()['expiry'] }}</small>
            }
          </label>

          <label class="pm-field">
            <span>CVV</span>
            <input
              type="password"
              name="cvv"
              inputmode="numeric"
              placeholder="•••"
              [ngModel]="cvv"
              (ngModelChange)="onCvvInput($event)"
              [class.invalid]="errors()['cvv']"
              [disabled]="processing()"
              autocomplete="cc-csc"
              maxlength="4"
            />
            @if (errors()['cvv']) {
              <small class="pm-error">{{ errors()['cvv'] }}</small>
            }
          </label>
        </div>

        <button type="submit" class="pm-submit" [disabled]="processing()">
          @if (processing()) {
            <span class="pm-spinner"></span> Procesando pago...
          } @else if (amount !== null) {
            Pagar S/ {{ amount.toFixed(2) }}
          } @else {
            Pagar y confirmar reserva
          }
        </button>

        <p class="pm-secure">🔒 Pago simulado — no se procesa un cargo real</p>
      </form>
    </div>
  </div>
}
